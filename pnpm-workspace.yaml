packages:
  - apps/*
  - packages/*

# Versions shared by more than one package. A package asks for one with
# "catalog:" so the whole workspace moves to a new version together.
catalog:
  "@next/eslint-plugin-next": 16.3.7
  "@types/node": 22.20.4
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  better-auth: 1.7.6
  drizzle-orm: 0.45.3
  fast-check: 4.10.2
  next: 16.3.7
  pg: 8.23.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.5

# eslint-plugin-jsx-a11y 6.10.2 lists ESLint 9 as its newest peer. It calls
# none of the APIs that ESLint 10 removed, and eslint-config-next ships it
# with ESLint 10 as well.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"

# Refuse to install on a Node version outside the engines range in
# package.json.
engineStrict: true

# esbuild's install script only checks its binary. The platform package
# that pnpm installs works without it.
ignoredBuiltDependencies:
  - esbuild
